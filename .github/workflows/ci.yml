# CI for the AI-импорт прайсов redesign (Nuxt 4 monolith). Runs the full `pnpm check`
# gate + SSG build + a backend Docker image build validation. Name kept as "CI" so
# the branch-protection required check and deploy.yml's workflow_run trigger map to it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — `tests/docsStructure.test.ts` compares each doc's «Last reviewed» stamp
      # with the file's last commit date, and it SKIPS itself on a shallow clone (one commit means
      # `git log` reports every file as touched today). The default checkout is depth 1, so that
      # guard has never once run in CI: a stamp back-dated to 2020 passed. History is the only
      # thing that makes it real.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm generate
      # Validate the shared front-proxy per-vhost tuning (deploy/vhost.d/*) — GH #71 option 3.
      # The app's OWN nginx.conf is validated by the docker-build job (Dockerfile `nginx -t`);
      # this covers the front nginx-proxy vhost snippet, which was otherwise only checked at
      # `make proxy-tune` apply time — so a broken file could reach prod (413/504 / proxy wedge).
      # Install nginx from the Ubuntu mirror (not Docker Hub) so the required gate has no
      # anonymous-pull rate-limit flake; check-vhost.sh uses the local binary when present.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light
      - run: sh scripts/check-vhost.sh

  docker-build:
    name: validate backend image builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Full build so the backend extraction toolchain (pdftotext/libreoffice/tesseract)
      # AND the app nginx config are validated in CI, not only on deploy. No push here.
      # ⚠ The SAME build-args as deploy.yml, and that is the point: the image asserts on its own
      # prerendered output (empty siteUrl → /install would refuse to bind B24 events), so a
      # validation build without them checks a DIFFERENT image than the one that ships — it would
      # go red on a healthy change and green on a broken deploy config. An unset repo variable
      # failing every PR is the intended signal, not a nuisance: it is exactly what would ship.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_METRIKA_ID=${{ vars.NUXT_PUBLIC_METRIKA_ID }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
